management:
  health:
    mail:
      enabled: false

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/medflow_db?currentSchema=auth_schema
    username: ${SPRING_DATASOURCE_USERNAME:medflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:medflow_pass}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: auth-service

jwt:
  secret: ${JWT_SECRET:default-secret-key-change-in-production-256-bits-minimum}

logging:
  level:
    com.medflow.auth: INFO
    org.springframework.security: INFO
