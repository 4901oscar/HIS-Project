# ============================================
# Test Environment Configuration
# ============================================
# This configuration is used during test execution

spring:
  application:
    name: patient-service-test
  
  # ============================================
  # Test Database Configuration (Testcontainers)
  # ============================================
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  
  # ============================================
  # JPA/Hibernate Configuration (Test)
  # ============================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # ============================================
  # Flyway Configuration (Test)
  # ============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  
  # ============================================
  # JavaMail Configuration (Test - Mock)
  # ============================================
  mail:
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  
  # ============================================
  # Async Task Execution Configuration (Test)
  # ============================================
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 50

# ============================================
# Server Configuration (Test)
# ============================================
server:
  port: 0

# ============================================
# Eureka Client Configuration (Test - Disabled)
# ============================================
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ============================================
# Custom Appointment Configuration (Test)
# ============================================
appointment:
  payment:
    amount: 150.00
    currency: GTQ
  qr:
    validity:
      before-minutes: 60
      after-minutes: 30
    image:
      width: 300
      height: 300
  availability:
    max-appointments-per-doctor-per-hour: 2
    working-hours:
      start: "06:00"
      end: "20:00"
    default-days-ahead: 30
  email:
    from: test@medflow.com
    subject: "Confirmación de Cita - MedFlow HIS"
    retry:
      max-attempts: 3
      backoff-delay: 1000

# ============================================
# Actuator Configuration (Test)
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ============================================
# Logging Configuration (Test)
# ============================================
logging:
  level:
    com.medflow.patient: DEBUG
    org.springframework.web: WARN
    org.springframework.mail: WARN
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
