spring:
  datasource:
    url: jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS lab_schema
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: lab_schema
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

lab:
  results:
    storage-path: ${java.io.tmpdir}/lab-results-test

logging:
  level:
    com.medflow.lab: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
