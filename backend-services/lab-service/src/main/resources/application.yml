server:
  port: 8084

spring:
  application:
    name: lab-service
  datasource:
    url: jdbc:postgresql://localhost:5432/medflow_db
    username: medflow_user
    password: medflow_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: lab_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    schemas: lab_schema
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

lab:
  results:
    storage-path: ${LAB_RESULTS_PATH:./lab-results}

file:
  upload:
    max-size: 10485760  # 10 MB in bytes
    allowed-types: application/pdf,image/jpeg,image/png

logging:
  level:
    com.medflow.lab: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
