# Test configuration for Eureka Server

spring:
  application:
    name: eureka-server-test

server:
  port: 0  # Random port for testing

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false

logging:
  level:
    root: ERROR
    com.medflow: INFO
